name: Build Flutter Apps

on:
  push:
    branches: [ "main", "workflow-setup" ]
  pull_request:
    branches: [ "main", "workflow-setup" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmake;3.22.1'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d -i > android/upload-keystore.jks
          cat <<EOF > android/key.properties
          key.store=upload-keystore.jks
          key.store.password=$STORE_PASSWORD
          key.alias=$KEY_ALIAS
          key.alias.password=$KEY_PASSWORD
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Compress Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: windows-x64.zip

  build-ios:
    name: Build iOS App (Unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Create Unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ios-unsigned.ipa Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ios/iphoneos/ios-unsigned.ipa

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-ios]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Version
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1 | tr -d '\r')
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW_VER"
          
          CURRENT_PATCH=$PATCH
          while gh release view "v${MAJOR}.${MINOR}.${CURRENT_PATCH}" >/dev/null 2>&1; do
            echo "Release v${MAJOR}.${MINOR}.${CURRENT_PATCH} already exists, bumping..."
            CURRENT_PATCH=$((CURRENT_PATCH + 1))
          done
          
          FINAL_TAG="v${MAJOR}.${MINOR}.${CURRENT_PATCH}"
          echo "Selected release tag: $FINAL_TAG"
          echo "tag=$FINAL_TAG" >> "$GITHUB_OUTPUT"

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.versioning.outputs.tag }}
        run: |
          gh release create "$TAG_NAME" \
            release-assets/app-release.apk \
            release-assets/windows-x64.zip \
            release-assets/ios-unsigned.ipa \
            --title "Release $TAG_NAME" \
            --generate-notes