name: openvk_aqua
description: "OpenVK iOS 6 styled client"
publish_to: 'none'
version: 0.4.0

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  sqflite: ^2.4.4+2
  sqflite_common_ffi: ^2.4.4
  path_provider: ^2.1.6
  path: ^1.9.1
  url_launcher: ^6.3.3
  flutter_launcher_icons: ^0.14.4
  video_player: ^2.14.1
  video_player_win: ^3.3.1
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/img/
    - assets/icon/
    - assets/login/
    - assets/navbar/
    - assets/navbar/ico/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_full.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  remove_alpha_ios: true
  
  windows:
    generate: true
    image_path: "assets/icon/app_icon_full.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon_full.png"
  linux:
    generate: true
    image_path: "assets/icon/app_icon_full.png"
